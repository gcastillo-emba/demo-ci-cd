version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns: ['*']
    ignore:
      # Majors (TypeScript 7, ESLint 10, react-router 8, ...) se evalúan a mano con un ADR, no en el grupo.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Desde 1.14.1, `openspec validate --strict` rechaza requisitos de más de 500 caracteres y las
      # specs vigentes tienen varios. Se libera cuando se partan esos requisitos (bitácora, PR #18).
      - dependency-name: '@fission-ai/openspec'
        versions: ['>= 1.14.1']
    # Regla del repo: solo versiones publicadas hace al menos 2 semanas (antes se cerraban PRs a mano, #26 y #27).
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: ['*']
    ignore:
      # Majors de Spring Boot (parent y starters) se evalúan a mano con un ADR.
      - dependency-name: 'org.springframework.boot:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.openapitools:openapi-generator-maven-plugin'
        update-types: ['version-update:semver-major']
      # springdoc 3.x requiere Spring Boot 4 (rompe el contexto con Boot 3.5; PR #7). Va junto con el major de Boot.
      - dependency-name: 'org.springdoc:*'
        update-types: ['version-update:semver-major']
    # Regla del repo: solo versiones publicadas hace al menos 2 semanas (antes se cerraban PRs a mano, #26 y #27).
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ['*']
    ignore:
      # Java 21, Node 22 y nginx estable están fijados por el plan maestro: solo minors/patches.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # En nginx las minors impares son mainline (1.31 = tag mainline); el plan fija la rama estable
      # (1.30 = tag stable). La próxima estable será 1.32 (PR #6).
      - dependency-name: 'nginxinc/nginx-unprivileged'
        versions: ['>= 1.31, < 1.32']
    # Regla del repo: solo versiones publicadas hace al menos 2 semanas (antes se cerraban PRs a mano, #26 y #27).
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    # Regla del repo: solo versiones publicadas hace al menos 2 semanas (antes se cerraban PRs a mano, #26 y #27).
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore(deps)'
