version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns: ['*']
    ignore:
      # Majors (TypeScript 7, ESLint 10, react-router 8, ...) se evalúan a mano con un ADR, no en el grupo.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Desde 1.14.1, `openspec validate --strict` rechaza requisitos de más de 500 caracteres y las
      # specs vigentes tienen varios. Se libera cuando se partan esos requisitos (bitácora, PR #18).
      - dependency-name: '@fission-ai/openspec'
        versions: ['>= 1.14.1']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: ['*']
    ignore:
      # Majors de Spring Boot (parent y starters) se evalúan a mano con un ADR.
      - dependency-name: 'org.springframework.boot:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.openapitools:openapi-generator-maven-plugin'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ['*']
    ignore:
      # Java 21, Node 22 y nginx estable están fijados por el plan maestro: solo minors/patches.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
