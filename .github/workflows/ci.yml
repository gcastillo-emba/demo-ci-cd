# CI completo (F3, ADR-003). `ci-ok` es el único check requerido por el ruleset: agrega todos los
# jobs con `if: always()`, así que sumar un job nuevo solo exige agregarlo a su `needs`.
# Todas las acciones están fijadas por SHA (comentario con la versión); dependabot las actualiza.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    name: spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run spec:validate

  tooling:
    name: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run hooks:test
      - run: npm run scripts:test
      - run: npm run format:check

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:lint
      - run: npm run api:check

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unit + ArchUnit + IT con Testcontainers + JaCoCo (umbral) + spotless:check.
      - name: mvnw verify
        run: sh ./mvnw -B -ntp verify
      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run frontend:lint
      - run: npm run frontend:typecheck
      - run: npm run frontend:test
      - run: npm run frontend:build

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Evals con el adaptador simulado (sin red ni secretos). El modelo real: evals-real.yml.
      - run: npm run evals

  e2e:
    name: e2e
    needs: [contract, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Construye las imágenes de docker-compose.yml (targets backend y frontend) con caché gha
      # por imagen y las carga en el daemon con los tags de compose (…:local).
      - name: Build de imágenes (bake + caché gha)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,mode=max,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend
      - name: Levantar el stack
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium de Playwright
        run: npm exec -w e2e -- playwright install --with-deps chromium
      - name: Playwright
        run: npm run test -w e2e
      - name: Logs de compose
        if: failure()
        run: docker compose logs --no-color --timestamps > compose.log 2>&1 || true
      - name: Subir artefactos E2E
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
            compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  # gitleaks dentro de CI para que bloquee vía `ci-ok`; security.yml lo repite en el escaneo semanal.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-ok:
    name: ci-ok
    needs: [spec, tooling, contract, backend, frontend, evals, e2e, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultado de los jobs requeridos
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Resultado de los jobs:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          if [ "$FAILED" = "true" ]; then
            echo "::error::Al menos un job requerido falló o fue cancelado."
            exit 1
          fi
          echo "ci-ok"
