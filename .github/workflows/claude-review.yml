# Revisión consultiva de PRs con Claude (ADR-003). INERTE salvo que existan ambos:
#   - variable de repo CLAUDE_REVIEW_ENABLED = 'true'
#   - secreto ANTHROPIC_API_KEY (hoy no provisto: bitácora #2)
# No es un check requerido: el gate de juicio formal es el agente `revisor` (revisor:aprobado).
#
# Endurecimiento (revisión de seguridad del PR #5):
#   - Solo corre para autores OWNER, MEMBER o COLLABORATOR (no para PRs de terceros).
#   - El prompt se lee de la rama BASE (git show origin/<base>:...), nunca del head del PR, para
#     que un PR no pueda reescribir las instrucciones del revisor.
#   - ANTHROPIC_API_KEY solo llega al paso de la acción; ningún paso `run` recibe el secreto
#     (el guard evalúa solo si existe, como booleano de la expresión).
#   - Acciones fijadas por SHA.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: >-
      vars.CLAUDE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Guard del secreto
        id: guard
        env:
          # Solo el booleano "existe el secreto", nunca su valor.
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY no está configurado: la revisión con Claude se omite."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.ok == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cargar el prompt del revisor (desde la rama base)
        id: prompt
        if: steps.guard.outputs.ok == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          prompt="$(git show "origin/${BASE_REF}:.github/prompts/revisor.md")"
          delim="PROMPT_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "text<<$delim"
            printf '%s\n' "$prompt"
            echo
            echo "Repositorio: $GITHUB_REPOSITORY. PR: #$PR_NUMBER."
            echo "Publica el resultado como un único comentario en el PR con gh pr comment."
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Revisión con Claude
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
