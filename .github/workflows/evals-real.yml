# Evals del asistente de descripciones (C4) contra el modelo real. Solo manual.
# INERTE sin el secreto ANTHROPIC_API_KEY (hoy no provisto: bitácora #2); el CI corre las evals
# con el adaptador simulado en el job `evals` de ci.yml.
# Scenario: Ejecución manual contra el modelo real
name: Evals (modelo real)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo a evaluar (vacío = el configurado por defecto en el backend)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  evals-real:
    name: evals-real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard del secreto
        id: guard
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY no está configurado: las evals con el modelo real se omiten."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.guard.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.ok == 'true'
        run: npm ci
      - name: Evals con el proveedor Anthropic
        if: steps.guard.outputs.ok == 'true'
        env:
          APP_ASSISTANT_PROVIDER: anthropic
          APP_ASSISTANT_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run evals
      - name: Subir reporte de evals
        if: always() && steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-real-report
          path: backend/target/evals/
          if-no-files-found: ignore
          retention-days: 14
