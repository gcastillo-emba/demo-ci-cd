spring:
  application:
    name: asuntos-horas-backend
  datasource:
    # Valores locales de desarrollo (falsos); en contenedores se sobrescriben por variables de entorno.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/asuntos}
    username: ${SPRING_DATASOURCE_USERNAME:asuntos}
    password: ${SPRING_DATASOURCE_PASSWORD:asuntos-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8081
  shutdown: graceful
  error:
    # Errores sin detalles internos (add-clients-matters D7): ni mensaje, ni traza, ni clase.
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db
  info:
    env:
      enabled: true

info:
  app:
    name: Asuntos & Horas
    description: POC MADA-MB (datos sintéticos)

# Swagger UI muestra el contrato estático (/openapi.yaml, copiado de api/openapi.yaml en el build).
# springdoc NO documenta el código: paths-to-match no coincide con ninguna ruta. api-docs queda
# habilitado solo porque springdoc 2.x desactiva Swagger UI si api-docs.enabled=false.
springdoc:
  paths-to-match: /__sin-documentacion-generada__
  swagger-ui:
    url: /openapi.yaml

logging:
  structured:
    format:
      console: ecs

app:
  jwt:
    # Sin valor por defecto: el backend no arranca si falta APP_JWT_SECRET (ADR-006).
    secret: ${APP_JWT_SECRET:}
    ttl: 2h
  time-zone: ${APP_TIME_ZONE:America/La_Paz}
  features:
    description-assistant: false
