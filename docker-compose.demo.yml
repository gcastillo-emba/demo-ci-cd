# Demo sin build: descarga las imágenes publicadas en GHCR (runbook F5, adjunto en cada release).
#   docker compose -f docker-compose.demo.yml up -d --wait
#   TAG=v0.1.0 docker compose -f docker-compose.demo.yml up -d --wait   (versión concreta)
# Abrir http://localhost:8080 e ingresar con un usuario de demo (ver README).
# Valores por defecto 100 % ficticios, solo para demo. Variables en .env.example.
name: asuntos-horas-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asuntos}
      POSTGRES_USER: ${POSTGRES_USER:-asuntos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asuntos-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    image: ghcr.io/gcastillo-emba/demo-ci-cd-backend:${TAG:-latest}
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asuntos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-asuntos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-asuntos-dev}
      # Sin valor: se pasa APP_JWT_SECRET del entorno solo si está definido. El secreto FALSO de
      # demo vive en un único lugar, application-demo.yml (perfil demo); ADR-006.
      APP_JWT_SECRET:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://localhost:8081/api/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    image: ghcr.io/gcastillo-emba/demo-ci-cd-frontend:${TAG:-latest}
    pull_policy: always
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
