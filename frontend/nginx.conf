# nginx del frontend: sirve el build de Vite (SPA) y hace proxy de /api/ al backend
# (mismo origen, sin CORS). Escucha en 8080 como usuario sin privilegios.

# Rate limiting del login (ASVS 2.2.1, ADR-006): 5 intentos por minuto por IP de cliente, con
# ráfaga de 5 sin demora; el exceso recibe 429 en application/problem+json. Clave = IP que ve
# nginx ($binary_remote_addr): si algún día hay otro proxy delante, cambiar a la IP real
# (real_ip_header) para no limitar a todos los usuarios juntos.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               image/svg+xml application/problem+json;

    # Cabeceras de seguridad (always: también en respuestas de error). Un add_header dentro de un
    # location reemplaza TODAS las heredadas, por eso los location que agregan cabeceras repiten
    # este bloque completo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Healthcheck del contenedor (no depende del backend).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Login con rate limiting por IP (ver limit_req_zone arriba).
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 @too_many_requests;

        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Respuesta 429 en RFC 9457 (mismo formato que el backend; traceId vacío porque no llega al backend).
    location @too_many_requests {
        default_type application/problem+json;
        charset utf-8;
        charset_types application/problem+json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        return 429 '{"type":"https://asuntos-horas.example/problems/too-many-requests","title":"Demasiados intentos","status":429,"detail":"Demasiados intentos de inicio de sesión. Espera un minuto e inténtalo de nuevo.","code":"too-many-requests","traceId":""}';
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Assets con hash de Vite: caché larga.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    }

    # SPA: cualquier ruta del cliente cae en index.html (sin caché para tomar el build nuevo).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    }
}
